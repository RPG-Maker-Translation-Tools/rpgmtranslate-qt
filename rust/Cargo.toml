[package]
name = "rpgmtranslate_rs"
version = "1.1.0"
edition = "2024"
publish = false

[lib]
name = "rpgmtranslate_rs"
crate-type = ["staticlib"]

[features]
languagetool = ["dep:reqwest", "dep:languagetool-rust"]
json-highlighting = ["lumis/lang-json"]
js-highlighting = ["lumis/lang-javascript"]
ruby-highlighting = ["lumis/lang-ruby"]
js-formatting = ["dep:dprint-plugin-typescript", "dep:anyhow"]
ruby-formatting = ["dep:rubyfmt"]

google-translate = ["dep:translators"]
yandex-translate = ["dep:yandex-translate-v2"]
deepl = ["dep:deepl"]
llm-connector = ["dep:llm-connector"]

chinese-icu = ["language-tokenizer/chinese-icu"]
chinese-lindera = ["language-tokenizer/chinese-lindera"]
japanese-icu = ["language-tokenizer/japanese-icu"]
japanese-lindera = ["language-tokenizer/japanese-lindera"]
korean-lindera = ["language-tokenizer/korean-lindera"]
snowball = ["language-tokenizer/snowball"]
southeast-asian = ["language-tokenizer/southeast-asian"]

serde-csv = ["rvpacker-txt-rs-lib/serde-csv"]
serde-xml = ["rvpacker-txt-rs-lib/serde-xml"]
serde-xlsx = ["rvpacker-txt-rs-lib/serde-xlsx"]
serde-yaml = ["rvpacker-txt-rs-lib/serde-yaml"]

[dependencies]
anyhow = { optional = true, version = "1.0.104" }
deepl = { version = "0.8.1", optional = true }
dprint-plugin-typescript = { version = "0.96.1", optional = true }
encoding_rs = "0.8.35"
gxhash = { version = "3.5.0", features = [
    "deterministic",
], default-features = false }
keyring = "4.2.0"
language-tokenizer = { version = "0.4.0", default-features = false }
languagetool-rust = { version = "3.0.1", default-features = false, optional = true, features = [
    "native-tls",
] }
llm-connector = { version = "1.4.0", optional = true }
log = "0.4.34"
lumis = { version = "0.13.0", default-features = false, optional = true }
reqwest = { version = "=0.12.28", default-features = false, optional = true, features = [
    "native-tls",
] }
rpgm-asset-decrypter-lib = "3.2.3"
rpgmad-lib = "5.0.1"
rubyfmt = { version = "0.14.1", optional = true, path = "./librubyfmt", default-features = false }
rvpacker-txt-rs-lib = { version = "16.2.0" }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
translators = { version = "0.2.0", features = [
    "google",
    "tokio-async",
], optional = true }
yandex-translate-v2 = { version = "0.1.3", features = [
    "async",
], default-features = false, optional = true }

[profile.release]
lto = "fat"
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.release.build-override]
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
opt-level = 3
strip = "symbols"
